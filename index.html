
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030812">
<title>ZERO TRACE</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --blue: #168cff;
    --cyan: #00c8ff;
    --white: #f5f9ff;
}

body {
    min-height: 100svh;
    padding: 14px;
    color: var(--white);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
        radial-gradient(ellipse at 50% 38%, #092c50 0%, transparent 65%),
        #03060c;
    overflow-x: hidden;
    position: relative;
}

/* ФОНОВОЕ СВЕЧЕНИЕ */

body::before,
body::after {
    content: "";
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    filter: blur(110px);
    pointer-events: none;
    z-index: 0;
    animation: ambient 7s ease-in-out infinite alternate;
}

body::before {
    background: #007bff;
    top: 15%;
    left: 30%;
    opacity: .18;
}

body::after {
    background: #00c8ff;
    bottom: 5%;
    right: 0;
    opacity: .10;
    animation-delay: -3s;
}

@keyframes ambient {
    from { transform: scale(.8); opacity: .10; }
    to { transform: scale(1.35); opacity: .25; }
}

/* ЯЗЫКИ */

.top {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    justify-content: flex-start;
    position: relative;
    z-index: 5;
}

.lang {
    display: flex;
    padding: 4px;
    border: 1px solid #263c55;
    background: #0b1320;
    border-radius: 50px;
    box-shadow: 0 0 20px #008cff30;
}

.lang button {
    border: none;
    background: transparent;
    color: #8998ab;
    padding: 8px 16px;
    border-radius: 40px;
    font-size: 13px;
    cursor: pointer;
    transition: .3s;
}

.lang button.active {
    background: #123253;
    color: white;
    box-shadow: 0 0 15px #008cff65;
}

/* ПЛАШКА */

.warning {
    position: absolute;
    top: 13px;
    right: 13px;
    width: 175px;
    padding: 11px 12px;
    border: 1px solid #287eb8;
    border-radius: 17px;
    background: rgba(7, 22, 40, .95);
    color: #c9eaff;
    font-size: 11px;
    line-height: 1.45;
    box-shadow: 0 0 17px #008cff40;
    animation: warningGlow 3s infinite alternate;
    z-index: 10;
}

.warning strong {
    color: #64caff;
}

.warning-arrow {
    position: absolute;
    top: -14px;
    right: 12px;
    color: #38bdff;
    font-size: 21px;
    transform: rotate(-35deg);
    text-shadow: 0 0 12px #008cff;
}

@keyframes warningGlow {
    from { box-shadow: 0 0 10px #008cff20; }
    to { box-shadow: 0 0 26px #008cff65; }
}

/* ОСНОВНОЙ БЛОК */

.container {
    width: 100%;
    max-width: 680px;
    margin: 72px auto 0;
    text-align: center;
    position: relative;
    z-index: 2;
}

/* ЛОГОТИП */

.logo {
    display: inline-block;
    padding: 12px 27px;
    border: 1px solid #087acb;
    border-radius: 50px;
    background: #07192b;
    color: #42caff;
    font-size: 13px;
    font-weight: 850;
    letter-spacing: 4px;
    box-shadow: 0 0 20px #008cff35;
    animation: logoGlow 3s ease-in-out infinite alternate;
}

@keyframes logoGlow {
    from { box-shadow: 0 0 10px #008cff25; }
    to { box-shadow: 0 0 30px #008cff80; }
}

h1 {
    margin-top: 24px;
    font-size: clamp(39px, 8vw, 56px);
    font-weight: 850;
    letter-spacing: -2px;
    text-shadow: 0 0 30px #168cff50;
}

.subtitle {
    color: #9caabd;
    font-size: 16px;
    margin-top: 9px;
}

/* КАРТОЧКИ */

.card {
    margin-top: 35px;
    padding: 29px 24px;
    border: 1px solid #24415e;
    border-radius: 34px;
    background:
        repeating-linear-gradient(
            135deg,
            transparent,
            transparent 23px,
            #168cff09 24px,
            #168cff09 26px
        ),
        linear-gradient(145deg, #102a43, #080e19 75%);
    box-shadow:
        0 0 35px #008cff25,
        0 0 90px #007bff12,
        inset 0 0 30px #168cff12;
    animation: cardAppear .65s ease both,
               cardGlow 4s infinite alternate;
}

@keyframes cardAppear {
    from {
        opacity: 0;
        transform: translateY(18px) scale(.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes cardGlow {
    from {
        box-shadow: 0 0 25px #008cff17, inset 0 0 20px #168cff08;
    }
    to {
        box-shadow: 0 0 45px #008cff40, inset 0 0 30px #168cff18;
    }
}

/* ИКОНКИ */

.symbol {
    width: 75px;
    height: 75px;
    margin: 0 auto 19px;
    display: grid;
    place-items: center;
    border: 1px solid #087bc5;
    border-radius: 25px;
    background: #0b2540;
    color: #36caff;
    font-size: 37px;
    box-shadow: 0 0 28px #008cff40;
    animation: iconFloat 3s ease-in-out infinite;
}

@keyframes iconFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}

.card h2 {
    font-size: clamp(21px, 5vw, 29px);
    margin-bottom: 9px;
}

.description {
    color: #9ba8b8;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 24px;
}

/* КНОПКИ */

.main-btn {
    display: block;
    width: 100%;
    max-width: 420px;
    margin: 12px auto 0;
    padding: 15px 13px;
    border-radius: 20px;
    border: 1px solid #45baff;
    background: linear-gradient(110deg, #0877df, #00aeea);
    color: white;
    font-size: 15px;
    font-weight: 750;
    cursor: pointer;
    box-shadow: 0 0 15px #008cff65,
                0 0 30px #008cff35;
    animation: buttonPulse 2.5s ease-in-out infinite;
    transition: transform .25s, filter .25s;
}

@keyframes buttonPulse {
    0%, 100% {
        box-shadow: 0 0 12px #008cff55, 0 0 25px #008cff25;
    }
    50% {
        box-shadow: 0 0 22px #00bfff95, 0 0 45px #008cff65;
    }
}

.main-btn:hover {
    transform: scale(1.025);
    filter: brightness(1.2);
}

.main-btn:active {
    transform: scale(.97);
}

.secondary {
    background: linear-gradient(110deg, #111e30, #152d47);
    border: 1px solid #32618a;
    animation-delay: .4s;
}

/* ССЫЛКА */

.result {
    display: none;
}

.link {
    word-break: break-all;
    color: #56c9ff;
    font-size: 13px;
    line-height: 1.6;
    margin: 12px 0 20px;
    padding: 13px;
    background: #071625;
    border: 1px solid #204c70;
    border-radius: 17px;
}

/* НАЗАД */

.back {
    background: transparent;
    color: #9ab5ce;
    border: none;
    padding: 12px;
    margin-top: 9px;
    font-size: 14px;
    cursor: pointer;
}

/* ФУТЕР */

footer {
    text-align: center;
    color: #52657b;
    font-size: 11px;
    margin-top: 20px;
    padding-bottom: 8px;
}

/* ПРИЗРАКИ */

.ghost {
    position: fixed;
    width: 23px;
    height: 23px;
    object-fit: contain;
    opacity: 0;
    pointer-events: none;
    z-index: 1;
    filter: drop-shadow(0 0 7px #159dff);
    animation: ghostFlight 14s linear forwards;
    will-change: transform, opacity;
}

@keyframes ghostFlight {
    0% {
        opacity: 0;
        transform: translate(0, 0) scale(.65) rotate(-8deg);
    }

    12% {
        opacity: .42;
    }

    40% {
        opacity: .35;
        transform: translate(35px, -45px) scale(.85) rotate(5deg);
    }

    75% {
        opacity: .22;
        transform: translate(75px, -90px) scale(1) rotate(-5deg);
    }

    100% {
        opacity: 0;
        transform: translate(105px, -125px) scale(.7) rotate(8deg);
    }
}

/* МОБИЛЬНАЯ ВЕРСИЯ */

@media(max-width: 600px) {
    body {
        padding: 12px;
    }

    .warning {
        top: 65px;
        right: 12px;
        width: 151px;
        padding: 9px 10px;
        font-size: 10px;
        border-radius: 17px;
    }

    .warning-arrow {
        right: 12px;
    }

    .container {
        margin-top: 72px;
    }

    .card {
        margin-top: 29px;
        padding: 25px 17px;
        border-radius: 29px;
    }

    .main-btn {
        padding: 14px 10px;
        font-size: 14px;
    }

    .subtitle {
        font-size: 15px;
    }
}

@media(prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<body>

<!-- ЯЗЫКИ -->
<div class="top">
    <div class="lang">
        <button id="ru" class="active" onclick="setLang('ru')">RU</button>
        <button id="en" onclick="setLang('en')">EN</button>
    </div>
</div>

<!-- ПЛАШКА -->
<div class="warning">
    <span class="warning-arrow">↗</span>
    <strong id="warningTitle">⚠️ Внимание!</strong>
    <span id="warningText">
        Если ссылка не открывается, нажмите на 3 полоски
        и выберите «Открыть в браузере».
    </span>
</div>

<main class="container">

    <div class="logo">ZERO TRACE</div>

    <h1 id="heading">Переходник</h1>

    <p class="subtitle" id="subtitle">
        Выберите нужное направление
    </p>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <section class="card" id="menu">

        <div class="symbol">⌁</div>

        <h2 id="menuTitle">Выберите бота</h2>

        <p class="description" id="menuDesc">
            Выберите одну из доступных ссылок
        </p>

        <button class="main-btn"
                onclick="showBot('snos')" id="snosBtn">
            Перейти в бота для сноса
        </button>

        <button class="main-btn secondary"
                onclick="showBot('probiv')" id="probivBtn">
            Перейти в бота для пробива
        </button>

    </section>

    <!-- КАРТОЧКА ССЫЛКИ -->
    <section class="card result" id="result">

        <div class="symbol">↗</div>

        <h2 id="resultTitle">Ваша ссылка</h2>

        <p class="description" id="resultDesc">
            Нажмите кнопку ниже для перехода
        </p>

        <div class="link" id="linkText"></div>

        <button class="main-btn"
                onclick="openTelegram()" id="telegramBtn">
            Перейти в Telegram
        </button>

        <button class="main-btn secondary"
                onclick="copyLink()" id="copyBtn">
            Скопировать ссылку
        </button>

        <button class="back"
                onclick="goBack()" id="backBtn">
            ← Назад
        </button>

    </section>

    <footer>ZERO TRACE © 2026</footer>

</main>

<script>

// ССЫЛКИ НА БОТОВ

const bots = {
    snos: "https://t.me/zerottracebot?start=ref_eyJhnre1ECbTo6ihrP6ne6g",
    probiv: "https://t.me/FaidikS_bot?start=cH7Uft92"
};

let selectedBot = "";
let language = "ru";

// ПЕРЕВОДЫ

const translations = {
    ru: {
        heading: "Переходник",
        subtitle: "Выберите нужное направление",
        menuTitle: "Выберите бота",
        menuDesc: "Выберите одну из доступных ссылок",
        snos: "Перейти в бота для сноса",
        probiv: "Перейти в бота для пробива",
        resultTitle: "Ваша ссылка",
        resultDesc: "Нажмите кнопку ниже для перехода",
        telegram: "Перейти в Telegram",
        copy: "Скопировать ссылку",
        copied: "Ссылка скопирована!",
        back: "← Назад",
        warningTitle: "⚠️ Внимание! ",
        warningText: "Если ссылка не открывается, нажмите на 3 полоски вверху экрана и выберите «Открыть в браузере»."
    },

    en: {
        heading: "Redirect",
        subtitle: "Choose your destination",
        menuTitle: "Choose a bot",
        menuDesc: "Select one of the available links",
        snos: "Open bot for takedown",
        probiv: "Open bot for lookup",
        resultTitle: "Your link",
        resultDesc: "Press the button below to continue",
        telegram: "Open in Telegram",
        copy: "Copy link",
        copied: "Link copied!",
        back: "← Back",
        warningTitle: "⚠️ Attention! ",
        warningText: "If the link doesn't open, tap the three lines at the top and select 'Open in Browser'."
    }
};

// СМЕНА ЯЗЫКА

function setLang(lang) {
    language = lang;
    const t = translations[lang];

    document.documentElement.lang = lang;

    document.getElementById("ru").classList.toggle("active", lang === "ru");
    document.getElementById("en").classList.toggle("active", lang === "en");

    document.getElementById("heading").textContent = t.heading;
    document.getElementById("subtitle").textContent = t.subtitle;
    document.getElementById("menuTitle").textContent = t.menuTitle;
    document.getElementById("menuDesc").textContent = t.menuDesc;
    document.getElementById("snosBtn").textContent = t.snos;
    document.getElementById("probivBtn").textContent = t.probiv;
    document.getElementById("resultTitle").textContent = t.resultTitle;
    document.getElementById("resultDesc").textContent = t.resultDesc;
    document.getElementById("telegramBtn").textContent = t.telegram;
    document.getElementById("copyBtn").textContent = t.copy;
    document.getElementById("backBtn").textContent = t.back;
    document.getElementById("warningTitle").textContent = t.warningTitle;
    document.getElementById("warningText").textContent = t.warningText;
}

// ПОКАЗ КАРТОЧКИ

function showBot(type) {
    selectedBot = bots[type];

    document.getElementById("menu").style.display = "none";

    const result = document.getElementById("result");
    result.style.display = "block";

    result.style.animation = "none";
    void result.offsetWidth;
    result.style.animation = "";

    document.getElementById("linkText").textContent = selectedBot;

    window.scrollTo({ top: 0, behavior: "smooth" });
}

// ПЕРЕХОД В TELEGRAM

function openTelegram() {
    if (!selectedBot) return;
    window.open(selectedBot, "_blank", "noopener,noreferrer");
}

// КОПИРОВАНИЕ

async function copyLink() {
    if (!selectedBot) return;

    try {
        await navigator.clipboard.writeText(selectedBot);
    } catch (error) {
        const input = document.createElement("textarea");
        input.value = selectedBot;
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        input.remove();
    }

    const btn = document.getElementById("copyBtn");
    btn.textContent = translations[language].copied;

    setTimeout(() => {
        btn.textContent = translations[language].copy;
    }, 1800);
}

// ВОЗВРАТ В МЕНЮ

function goBack() {
    document.getElementById("result").style.display = "none";
    document.getElementById("menu").style.display = "block";

    selectedBot = "";

    window.scrollTo({ top: 0, behavior: "smooth" });
}

// ==================================
// ЛЕТАЮЩИЕ ПРИЗРАКИ ИЗ ТВОЕГО PNG
// ==================================

const ghostImage = "Без названия18_20260909224116.png";

let activeGhosts = 0;

function createGhost() {

    // Максимум три призрака одновременно
    if (activeGhosts >= 3) return;

    activeGhosts++;

    const ghost = document.createElement("img");

    ghost.src = ghostImage;
    ghost.className = "ghost";
    ghost.alt = "";

    // Маленький случайный размер
    const size = 17 + Math.random() * 11;

    ghost.style.width = size + "px";
    ghost.style.height = size + "px";

    // Случайное положение
    ghost.style.left = (5 + Math.random() * 85) + "vw";
    ghost.style.top = (35 + Math.random() * 55) + "vh";

    // Немного разная скорость
    ghost.style.animationDuration =
        (12 + Math.random() * 5) + "s";

    document.body.appendChild(ghost);

    ghost.addEventListener("animationend", () => {
        ghost.remove();
        activeGhosts--;
    }, { once: true });
}

// РЕДКОЕ ПОЯВЛЕНИЕ ПРИЗРАКОВ

setInterval(() => {
    if (Math.random() > 0.35) {
        createGhost();
    }
}, 4500);

</script>

</body>
</html>
