
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>ZERO TRACE</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --blue: #168cff;
    --cyan: #00c8ff;
    --white: #f5f9ff;
}

body {
    min-height: 100svh;
    height: 100svh;
    padding: 10px;
    color: var(--white);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #000;
    overflow: hidden;
    position: relative;
}

/* ГОЛУБОЕ ФОНОВОЕ СВЕЧЕНИЕ */

body::before,
body::after {
    content: "";
    position: fixed;
    width: 340px;
    height: 340px;
    border-radius: 50%;
    filter: blur(110px);
    pointer-events: none;
    z-index: 0;
    animation: ambient 6s ease-in-out infinite alternate;
}

body::before {
    background: #006eff;
    top: 15%;
    left: 20%;
    opacity: .18;
}

body::after {
    background: #00bfff;
    bottom: 0;
    right: 0;
    opacity: .13;
    animation-delay: -3s;
}

@keyframes ambient {
    from {
        transform: scale(.8);
        opacity: .10;
    }
    to {
        transform: scale(1.3);
        opacity: .24;
    }
}

/* ВЕРХНЯЯ ПАНЕЛЬ */

.top {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    justify-content: flex-start;
    position: relative;
    z-index: 5;
}

.lang {
    display: flex;
    padding: 3px;
    border: 1px solid #263c55;
    background: #000;
    border-radius: 50px;
    box-shadow: 0 0 17px #008cff50;
}

.lang button {
    border: none;
    background: transparent;
    color: #8998ab;
    padding: 7px 13px;
    border-radius: 40px;
    font-size: 12px;
    cursor: pointer;
}

.lang button.active {
    background: #101010;
    color: white;
    box-shadow: 0 0 16px #008cff80;
}

/* ПЛАШКА */

.warning {
    position: absolute;
    top: 10px;
    right: max(10px, calc((100vw - 680px) / 2));
    width: 165px;
    padding: 8px 10px;
    border: 1px solid #287eb8;
    border-radius: 14px;
    background: #050505;
    color: #c9eaff;
    font-size: 10px;
    line-height: 1.35;
    box-shadow: 0 0 22px #008cff50;
    animation: warningGlow 3s infinite alternate;
    z-index: 10;
}

.warning strong {
    display: block;
    color: #64caff;
    margin-bottom: 3px;
}

.warning-arrow {
    position: absolute;
    top: -13px;
    right: 10px;
    color: #38bdff;
    font-size: 20px;
    transform: rotate(-35deg);
    text-shadow: 0 0 12px #008cff;
}

@keyframes warningGlow {
    from { box-shadow: 0 0 12px #008cff30; }
    to { box-shadow: 0 0 28px #008cff90; }
}

/* ОСНОВНОЙ БЛОК */

.container {
    width: 100%;
    max-width: 600px;
    margin: 43px auto 0;
    text-align: center;
    position: relative;
    z-index: 2;
}

/* ЛОГОТИП */

.logo {
    display: inline-block;
    padding: 9px 23px;
    border: 1px solid #087acb;
    border-radius: 50px;
    background: #000;
    color: #42caff;
    font-size: 12px;
    font-weight: 850;
    letter-spacing: 4px;
    box-shadow: 0 0 24px #008cff60;
    animation: logoGlow 2.5s ease-in-out infinite alternate;
}

@keyframes logoGlow {
    from {
        box-shadow: 0 0 12px #008cff35;
        text-shadow: 0 0 5px #008cff;
    }
    to {
        box-shadow: 0 0 32px #008cff95;
        text-shadow: 0 0 15px #00bfff;
    }
}

h1 {
    margin-top: 15px;
    font-size: clamp(34px, 7vw, 48px);
    font-weight: 850;
    letter-spacing: -2px;
    text-shadow: 0 0 32px #168cff85;
    animation: headingAppear .8s ease both;
}

@keyframes headingAppear {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.subtitle {
    color: #a9b9ca;
    font-size: 14px;
    margin-top: 5px;
}

/* КАРТОЧКИ */

.card {
    margin-top: 19px;
    padding: 20px 19px;
    border: 1px solid #17629b;
    border-radius: 27px;
    background: #000;
    box-shadow:
        0 0 30px #008cff35,
        0 0 65px #008cff15,
        inset 0 0 25px #008cff12;
    animation: cardAppear .65s ease both,
               cardGlow 3s infinite alternate;
}

@keyframes cardAppear {
    from {
        opacity: 0;
        transform: translateY(15px) scale(.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes cardGlow {
    from {
        box-shadow: 0 0 20px #008cff25, inset 0 0 15px #168cff08;
    }
    to {
        box-shadow: 0 0 45px #008cff65, inset 0 0 25px #168cff15;
    }
}

/* ИКОНКИ */

.symbol {
    width: 57px;
    height: 57px;
    margin: 0 auto 12px;
    display: grid;
    place-items: center;
    border: 1px solid #087bc5;
    border-radius: 19px;
    background: #000;
    color: #36caff;
    font-size: 30px;
    box-shadow: 0 0 28px #008cff70;
    animation: iconFloat 3s ease-in-out infinite;
}

@keyframes iconFloat {
    0%, 100% { transform: translateY(0) rotate(0); }
    50% { transform: translateY(-5px) rotate(4deg); }
}

.card h2 {
    font-size: clamp(20px, 5vw, 26px);
    margin-bottom: 7px;
}

.description {
    color: #9ba8b8;
    font-size: 13px;
    line-height: 1.4;
    margin-bottom: 15px;
}

/* КНОПКИ */

.main-btn {
    display: block;
    width: 100%;
    max-width: 390px;
    margin: 10px auto 0;
    padding: 13px 10px;
    border-radius: 17px;
    border: 1px solid #168cff;
    background: #000;
    color: white;
    font-size: 14px;
    font-weight: 750;
    cursor: pointer;
    box-shadow: 0 0 18px #008cff50;
    animation: buttonPulse 2s ease-in-out infinite;
    transition: transform .25s, border-color .25s;
}

@keyframes buttonPulse {
    0%, 100% {
        box-shadow:
            0 0 10px #008cff45,
            0 0 22px #008cff25;
        border-color: #126fc0;
    }
    50% {
        box-shadow:
            0 0 23px #00bfffaa,
            0 0 48px #008cff85;
        border-color: #50d3ff;
    }
}

.main-btn:hover {
    transform: scale(1.025);
}

.main-btn:active {
    transform: scale(.96);
}

.secondary {
    background: #000;
    border-color: #32618a;
    animation-delay: .4s;
}

/* ССЫЛКА */

.result {
    display: none;
}

.link {
    word-break: break-all;
    color: #56c9ff;
    font-size: 12px;
    line-height: 1.5;
    margin: 10px 0 15px;
    padding: 11px;
    background: #000;
    border: 1px solid #204c70;
    border-radius: 15px;
    box-shadow: 0 0 15px #008cff25;
}

/* НАЗАД */

.back {
    background: transparent;
    color: #9ab5ce;
    border: none;
    padding: 10px;
    margin-top: 5px;
    font-size: 13px;
    cursor: pointer;
}

/* ФУТЕР */

footer {
    text-align: center;
    color: #52657b;
    font-size: 10px;
    margin-top: 13px;
}

/* ЛЕТАЮЩИЕ ПРИЗРАКИ */

.ghost {
    position: fixed;
    display: block;
    object-fit: contain;
    opacity: 0;
    pointer-events: none;
    z-index: 1;
    filter:
        drop-shadow(0 0 5px #159dff)
        drop-shadow(0 0 12px #008cff);
    animation: ghostFlight 9s ease-in-out forwards;
    will-change: transform, opacity;
}

@keyframes ghostFlight {
    0% {
        opacity: 0;
        transform: translate(0, 0) scale(.55) rotate(-10deg);
    }
    15% {
        opacity: .75;
    }
    35% {
        opacity: .65;
        transform: translate(35px, -35px) scale(.85) rotate(8deg);
    }
    65% {
        opacity: .55;
        transform: translate(80px, -75px) scale(1.05) rotate(-8deg);
    }
    85% {
        opacity: .3;
    }
    100% {
        opacity: 0;
        transform: translate(125px, -125px) scale(.7) rotate(12deg);
    }
}

/* ТЕЛЕФОНЫ */

@media(max-width: 600px) {
    body {
        padding: 9px;
    }

    .warning {
        top: 9px;
        right: 9px;
        width: 143px;
        padding: 7px 8px;
        font-size: 9px;
    }

    .container {
        margin-top: 51px;
    }

    .card {
        margin-top: 17px;
        padding: 18px 14px;
        border-radius: 24px;
    }

    .main-btn {
        padding: 12px 9px;
        font-size: 13px;
        margin-top: 9px;
    }

    .symbol {
        width: 51px;
        height: 51px;
        font-size: 27px;
        margin-bottom: 10px;
    }

    .description {
        margin-bottom: 12px;
    }

    footer {
        margin-top: 10px;
    }
}

/* НИЗКИЕ ЭКРАНЫ */

@media(max-height: 680px) {
    .container {
        margin-top: 30px;
    }

    .card {
        margin-top: 12px;
        padding: 13px;
    }

    .symbol {
        width: 43px;
        height: 43px;
        font-size: 24px;
        margin-bottom: 7px;
    }

    h1 {
        margin-top: 10px;
    }

    .description {
        margin-bottom: 8px;
    }

    .main-btn {
        padding: 10px;
        margin-top: 7px;
    }

    footer {
        margin-top: 7px;
    }
}

@media(prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<body>

<div class="top">
    <div class="lang">
        <button id="ru" class="active" onclick="setLang('ru')">RU</button>
        <button id="en" onclick="setLang('en')">EN</button>
    </div>
</div>

<div class="warning">
    <span class="warning-arrow">↗</span>
    <strong id="warningTitle">⚠️ Внимание!</strong>
    <span id="warningText">
        Если ссылка не открывается, нажмите на 3 полоски и выберите «Открыть в браузере».
    </span>
</div>

<main class="container">

    <div class="logo">ZERO TRACE</div>

    <h1 id="heading">Переходник</h1>

    <p class="subtitle" id="subtitle">
        Выберите нужное направление
    </p>

    <section class="card" id="menu">

        <div class="symbol">⌁</div>

        <h2 id="menuTitle">Выберите бота</h2>

        <p class="description" id="menuDesc">
            Выберите одну из доступных ссылок
        </p>

        <button class="main-btn"
                onclick="showBot('snos')" id="snosBtn">
            Перейти в бота для сноса
        </button>

        <button class="main-btn secondary"
                onclick="showBot('probiv')" id="probivBtn">
            Перейти в бота для пробива
        </button>

    </section>

    <section class="card result" id="result">

        <div class="symbol">↗</div>

        <h2 id="resultTitle">Ваша ссылка</h2>

        <p class="description" id="resultDesc">
            Нажмите кнопку ниже для перехода
        </p>

        <div class="link" id="linkText"></div>

        <button class="main-btn"
                onclick="openTelegram()" id="telegramBtn">
            Перейти в Telegram
        </button>

        <button class="main-btn secondary"
                onclick="copyLink()" id="copyBtn">
            Скопировать ссылку
        </button>

        <button class="back"
                onclick="goBack()" id="backBtn">
            ← Назад
        </button>

    </section>

    <footer>ZERO TRACE © 2026</footer>

</main>

<script>

// ССЫЛКИ

const bots = {
    snos: "https://t.me/zerottracebot?start=ref_eyJhnre1ECbTo6ihrP6ne6g",
    probiv: "https://t.me/FaidikS_bot?start=cH7Uft92"
};

let selectedBot = "";
let language = "ru";

// ПЕРЕВОДЫ

const translations = {
    ru: {
        heading: "Переходник",
        subtitle: "Выберите нужное направление",
        menuTitle: "Выберите бота",
        menuDesc: "Выберите одну из доступных ссылок",
        snos: "Перейти в бота для сноса",
        probiv: "Перейти в бота для пробива",
        resultTitle: "Ваша ссылка",
        resultDesc: "Нажмите кнопку ниже для перехода",
        telegram: "Перейти в Telegram",
        copy: "Скопировать ссылку",
        copied: "Ссылка скопирована!",
        back: "← Назад",
        warningTitle: "⚠️ Внимание!",
        warningText: "Если ссылка не открывается, нажмите на 3 полоски вверху экрана и выберите «Открыть в браузере»."
    },

    en: {
        heading: "Redirect",
        subtitle: "Choose your destination",
        menuTitle: "Choose a bot",
        menuDesc: "Select one of the available links",
        snos: "Open bot for takedown",
        probiv: "Open bot for lookup",
        resultTitle: "Your link",
        resultDesc: "Press the button below to continue",
        telegram: "Open in Telegram",
        copy: "Copy link",
        copied: "Link copied!",
        back: "← Back",
        warningTitle: "⚠️ Attention!",
        warningText: "If the link doesn't open, tap the three lines at the top and select 'Open in Browser'."
    }
};

// СМЕНА ЯЗЫКА

function setLang(lang) {
    language = lang;
    const t = translations[lang];

    document.documentElement.lang = lang;

    document.getElementById("ru").classList.toggle("active", lang === "ru");
    document.getElementById("en").classList.toggle("active", lang === "en");

    document.getElementById("heading").textContent = t.heading;
    document.getElementById("subtitle").textContent = t.subtitle;
    document.getElementById("menuTitle").textContent = t.menuTitle;
    document.getElementById("menuDesc").textContent = t.menuDesc;
    document.getElementById("snosBtn").textContent = t.snos;
    document.getElementById("probivBtn").textContent = t.probiv;
    document.getElementById("resultTitle").textContent = t.resultTitle;
    document.getElementById("resultDesc").textContent = t.resultDesc;
    document.getElementById("telegramBtn").textContent = t.telegram;
    document.getElementById("copyBtn").textContent = t.copy;
    document.getElementById("backBtn").textContent = t.back;
    document.getElementById("warningTitle").textContent = t.warningTitle;
    document.getElementById("warningText").textContent = t.warningText;
}

// ПОКАЗ КАРТОЧКИ

function showBot(type) {
    selectedBot = bots[type];

    document.getElementById("menu").style.display = "none";

    const result = document.getElementById("result");
    result.style.display = "block";

    result.style.animation = "none";
    void result.offsetWidth;
    result.style.animation = "";

    document.getElementById("linkText").textContent = selectedBot;
}

// ПЕРЕХОД В TELEGRAM

function openTelegram() {
    if (!selectedBot) return;
    window.open(selectedBot, "_blank", "noopener,noreferrer");
}

// КОПИРОВАНИЕ

async function copyLink() {
    if (!selectedBot) return;

    try {
        await navigator.clipboard.writeText(selectedBot);
    } catch (error) {
        const input = document.createElement("textarea");
        input.value = selectedBot;
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        input.remove();
    }

    const btn = document.getElementById("copyBtn");
    btn.textContent = translations[language].copied;

    setTimeout(() => {
        btn.textContent = translations[language].copy;
    }, 1800);
}

// ВОЗВРАТ В МЕНЮ

function goBack() {
    document.getElementById("result").style.display = "none";
    document.getElementById("menu").style.display = "block";

    selectedBot = "";
}

// ЛЕТАЮЩИЕ ПРИЗРАКИ

const ghostImage = "Без названия18_20260909224116.png";

let activeGhosts = 0;

function createGhost() {

    // Максимум четыре призрака одновременно
    if (activeGhosts >= 4) return;

    activeGhosts++;

    const ghost = document.createElement("img");

    ghost.src = ghostImage;
    ghost.className = "ghost";
    ghost.alt = "";

    // Случайный размер
    const size = 19 + Math.random() * 13;

    ghost.style.width = size + "px";
    ghost.style.height = size + "px";

    // Случайное положение по всему экрану
    ghost.style.left = (Math.random() * 88) + "vw";
    ghost.style.top = (20 + Math.random() * 70) + "vh";

    // Случайная продолжительность полёта
    ghost.style.animationDuration =
        (8 + Math.random() * 5) + "s";

    // Небольшой разброс скорости
    ghost.style.animationDelay = "0s";

    document.body.appendChild(ghost);

    // Если PNG не найден — выводим ошибку в консоль
    ghost.onerror = () => {
        console.warn("Не найден файл призрака:", ghostImage);
        ghost.remove();
        activeGhosts--;
    };

    ghost.addEventListener("animationend", () => {
        ghost.remove();
        activeGhosts--;
    }, { once: true });
}

// ПРИЗРАКИ ПОЯВЛЯЮТСЯ ЧАЩЕ

createGhost();

setInterval(() => {
    createGhost();
}, 2600);

</script>

</body>
</html>
