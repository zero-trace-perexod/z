
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05080d">
<title>ZERO TRACE</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --blue: #168cff;
    --cyan: #00c8ff;
    --bg: #05070b;
    --text: #f5f8ff;
    --muted: #9299a8;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(ellipse at 50% 35%, #09213b 0%, transparent 55%),
        #05070b;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont,
                 "Segoe UI", sans-serif;
    padding: 22px;
    overflow-x: hidden;
}

button {
    font: inherit;
    cursor: pointer;
}

.top {
    width: 100%;
    max-width: 950px;
    margin: 0 auto;
    display: flex;
    justify-content: flex-end;
}

.lang {
    display: flex;
    padding: 5px;
    border: 1px solid #252c37;
    background: #10141b;
    border-radius: 40px;
}

.lang button {
    border: 0;
    background: transparent;
    color: #858d9c;
    padding: 10px 19px;
    border-radius: 30px;
    font-size: 14px;
}

.lang button.active {
    background: #202a38;
    color: white;
}

.container {
    max-width: 750px;
    margin: 115px auto 70px;
    text-align: center;
}

.logo {
    display: inline-block;
    padding: 17px 32px;
    border: 1px solid #075c9d;
    border-radius: 50px;
    color: var(--cyan);
    background: #071726;
    letter-spacing: 5px;
    font-size: 15px;
    font-weight: 800;
    box-shadow: 0 0 30px #008cff18;
}

h1 {
    margin-top: 35px;
    font-size: clamp(42px, 9vw, 65px);
    font-weight: 850;
    letter-spacing: -2px;
}

.subtitle {
    color: var(--muted);
    font-size: 19px;
    margin-top: 17px;
    line-height: 1.5;
}

.card {
    margin-top: 75px;
    padding: 45px 35px;
    border: 1px solid #293644;
    border-radius: 32px;
    background:
        repeating-linear-gradient(
            135deg,
            transparent,
            transparent 24px,
            #168cff08 25px,
            #168cff08 27px
        ),
        linear-gradient(145deg, #102337, #090c12 75%);
    box-shadow:
        0 0 50px #008cff0d,
        inset 0 0 35px #168cff08;
}

.symbol {
    width: 100px;
    height: 100px;
    margin: 0 auto 27px;
    display: grid;
    place-items: center;
    border: 1px solid #1267a5;
    border-radius: 25px;
    background: #09213a;
    color: var(--cyan);
    font-size: 43px;
    box-shadow: 0 0 30px #008cff19;
}

.card h2 {
    font-size: clamp(23px, 5vw, 32px);
    margin-bottom: 12px;
}

.description {
    color: var(--muted);
    font-size: 16px;
    margin-bottom: 35px;
    line-height: 1.5;
}

.main-btn {
    width: 100%;
    display: block;
    border: 0;
    padding: 20px 15px;
    border-radius: 18px;
    margin-top: 16px;
    color: white;
    font-weight: 750;
    font-size: 17px;
    background: linear-gradient(110deg, #087bea, #00b9ed);
    box-shadow: 0 5px 25px #008cff30;
    transition: .2s;
}

.main-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 35px #008cff55;
}

.secondary {
    background: #101720;
    border: 1px solid #344253;
    box-shadow: none;
}

.secondary:hover {
    background: #172536;
}

.warning {
    max-width: 750px;
    margin: 0 auto 35px;
    padding: 19px 22px;
    border: 1px solid #69511e;
    border-radius: 17px;
    background: #17150e;
    color: #e7c477;
    font-size: 14px;
    line-height: 1.6;
    text-align: left;
}

.warning strong {
    color: #ffcf61;
}

.result {
    display: none;
}

.link {
    word-break: break-all;
    color: #75caff;
    font-size: 15px;
    margin: 15px 0 25px;
    line-height: 1.6;
}

.back {
    color: #91a0b2;
    background: transparent;
    border: 0;
    padding: 15px;
    margin-top: 12px;
}

footer {
    color: #535e6d;
    text-align: center;
    font-size: 12px;
    padding: 20px;
}

@media(max-width: 600px) {
    body {
        padding: 15px;
    }

    .container {
        margin-top: 85px;
    }

    .card {
        padding: 35px 20px;
        margin-top: 55px;
        border-radius: 25px;
    }

    .warning {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="top">
    <div class="lang">
        <button id="ru" class="active" onclick="setLang('ru')">RU</button>
        <button id="en" onclick="setLang('en')">EN</button>
    </div>
</div>

<main class="container">

    <div class="logo">ZERO TRACE</div>

    <h1 id="heading">Переходник</h1>
    <p class="subtitle" id="subtitle">
        Выберите нужное направление
    </p>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <section class="card" id="menu">

        <div class="symbol">⌁</div>

        <h2 id="menuTitle">Выберите бота</h2>

        <p class="description" id="menuDesc">
            Выберите одну из доступных ссылок
        </p>

        <button class="main-btn" onclick="showBot('snos')"
                id="snosBtn">
            Перейти в бота для сноса
        </button>

        <button class="main-btn secondary"
                onclick="showBot('probiv')" id="probivBtn">
            Перейти в бота для пробива
        </button>

    </section>

    <!-- КАРТОЧКА ССЫЛКИ -->
    <section class="card result" id="result">

        <div class="symbol">↗</div>

        <h2 id="resultTitle">Ваша ссылка</h2>

        <p class="description" id="resultDesc">
            Нажмите кнопку ниже для перехода
        </p>

        <div class="link" id="linkText"></div>

        <button class="main-btn" id="telegramBtn"
                onclick="openTelegram()">
            Перейти в Telegram
        </button>

        <button class="main-btn secondary"
                onclick="copyLink()" id="copyBtn">
            Скопировать ссылку
        </button>

        <button class="back" onclick="goBack()" id="backBtn">
            ← Назад
        </button>

    </section>

</main>

<!-- ПРЕДУПРЕЖДЕНИЕ -->
<div class="warning">
    <strong id="warningTitle">⚠️ Внимание!</strong>
    <span id="warningText">
        Если ссылка не открывается, нажмите на 3 полоски
        вверху экрана и выберите «Открыть в браузере».
    </span>
</div>

<footer>ZERO TRACE © 2026</footer>

<script>

// ====================================
// ССЫЛКИ НА БОТОВ
// ====================================

const bots = {
    snos: "https://t.me/zerottracebot?start=ref_eyJhnre1ECbTo6ihrP6ne6g",

    probiv: "https://t.me/FaidikS_bot?start=cH7Uft92"
};

let selectedBot = "";

// ====================================
// ПЕРЕКЛЮЧЕНИЕ ЯЗЫКА
// ====================================

let language = "ru";

const translations = {
    ru: {
        heading: "Переходник",
        subtitle: "Выберите нужное направление",
        menuTitle: "Выберите бота",
        menuDesc: "Выберите одну из доступных ссылок",
        snos: "Перейти в бота для сноса",
        probiv: "Перейти в бота для пробива",
        resultTitle: "Ваша ссылка",
        resultDesc: "Нажмите кнопку ниже для перехода",
        telegram: "Перейти в Telegram",
        copy: "Скопировать ссылку",
        copied: "Ссылка скопирована!",
        back: "← Назад",
        warningTitle: "⚠️ Внимание! ",
        warningText: "Если ссылка не открывается, нажмите на 3 полоски вверху экрана и выберите «Открыть в браузере»."
    },

    en: {
        heading: "Redirect",
        subtitle: "Choose your destination",
        menuTitle: "Choose a bot",
        menuDesc: "Select one of the available links",
        snos: "Open bot for takedown",
        probiv: "Open bot for lookup",
        resultTitle: "Your link",
        resultDesc: "Press the button below to continue",
        telegram: "Open in Telegram",
        copy: "Copy link",
        copied: "Link copied!",
        back: "← Back",
        warningTitle: "⚠️ Attention! ",
        warningText: "If the link doesn't open, tap the three lines at the top and select 'Open in Browser'."
    }
};

function setLang(lang) {
    language = lang;

    const t = translations[lang];

    document.documentElement.lang = lang;

    document.getElementById("ru").classList.toggle(
        "active", lang === "ru"
    );

    document.getElementById("en").classList.toggle(
        "active", lang === "en"
    );

    document.getElementById("heading").textContent = t.heading;
    document.getElementById("subtitle").textContent = t.subtitle;
    document.getElementById("menuTitle").textContent = t.menuTitle;
    document.getElementById("menuDesc").textContent = t.menuDesc;
    document.getElementById("snosBtn").textContent = t.snos;
    document.getElementById("probivBtn").textContent = t.probiv;
    document.getElementById("resultTitle").textContent = t.resultTitle;
    document.getElementById("resultDesc").textContent = t.resultDesc;
    document.getElementById("telegramBtn").textContent = t.telegram;
    document.getElementById("copyBtn").textContent = t.copy;
    document.getElementById("backBtn").textContent = t.back;
    document.getElementById("warningTitle").textContent = t.warningTitle;
    document.getElementById("warningText").textContent = t.warningText;
}

// ====================================
// ОТКРЫТИЕ КАРТОЧКИ
// ====================================

function showBot(type) {

    selectedBot = bots[type];

    document.getElementById("menu").style.display = "none";

    document.getElementById("result").style.display = "block";

    document.getElementById("linkText").textContent = selectedBot;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

// ====================================
// ПЕРЕХОД В TELEGRAM
// ====================================

function openTelegram() {

    if (!selectedBot) return;

    window.open(selectedBot, "_blank", "noopener,noreferrer");
}

// ====================================
// КОПИРОВАНИЕ ССЫЛКИ
// ====================================

async function copyLink() {

    if (!selectedBot) return;

    try {
        await navigator.clipboard.writeText(selectedBot);
    } catch (error) {
        const input = document.createElement("textarea");
        input.value = selectedBot;
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        input.remove();
    }

    const btn = document.getElementById("copyBtn");

    btn.textContent = translations[language].copied;

    setTimeout(() => {
        btn.textContent = translations[language].copy;
    }, 1800);
}

// ====================================
// ВОЗВРАТ В МЕНЮ
// ====================================

function goBack() {

    document.getElementById("result").style.display = "none";

    document.getElementById("menu").style.display = "block";

    selectedBot = "";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

</script>

</body>
</html>
