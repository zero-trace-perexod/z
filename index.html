<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zero-Trace</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: #000;
}

body {
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;

    background:
        radial-gradient(
            circle at 50% 45%,
            #000d1c 0%,
            #000409 40%,
            #000 82%
        );
}


/* =========================
   ПРИЗРАКИ НА ФОНЕ
========================= */

.ghosts {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
}

.ghost {
    position: absolute;

    width: var(--size);
    height: var(--size);

    object-fit: contain;

    mix-blend-mode: screen;

    filter:
        drop-shadow(0 0 5px rgba(0,120,255,.95))
        drop-shadow(0 0 14px rgba(0,110,255,.65))
        drop-shadow(0 0 28px rgba(0,80,255,.30));

    opacity: 0;

    will-change: transform, opacity;

    animation:
        ghostMove var(--duration) ease-in-out infinite,
        ghostFade var(--fade) ease-in-out infinite;

    animation-delay: var(--delay);

    user-select: none;
}


@keyframes ghostMove {

    0% {
        transform:
            translate3d(0,0,0)
            rotate(-4deg)
            scale(.90);
    }

    20% {
        transform:
            translate3d(55px,-35px,0)
            rotate(3deg)
            scale(1);
    }

    40% {
        transform:
            translate3d(-35px,-75px,0)
            rotate(-2deg)
            scale(.96);
    }

    60% {
        transform:
            translate3d(-70px,-30px,0)
            rotate(4deg)
            scale(1.04);
    }

    80% {
        transform:
            translate3d(30px,30px,0)
            rotate(-3deg)
            scale(.97);
    }

    100% {
        transform:
            translate3d(0,0,0)
            rotate(-4deg)
            scale(.90);
    }
}


@keyframes ghostFade {

    0% {
        opacity: 0;
    }

    15% {
        opacity: var(--opacity);
    }

    45% {
        opacity: var(--opacity);
    }

    72% {
        opacity: calc(var(--opacity) * .65);
    }

    90% {
        opacity: 0;
    }

    100% {
        opacity: 0;
    }
}


/* =========================
   ЦЕНТРАЛЬНОЕ СВЕЧЕНИЕ
========================= */

.bg-glow {
    position: fixed;

    width: 420px;
    height: 420px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    background: #007bff;

    filter: blur(190px);

    opacity: .055;

    pointer-events: none;

    z-index: 2;
}


/* =========================
   ПОДСКАЗКА НА ТЕЛЕФОНЕ
========================= */

.help {
    display: none;

    position: fixed;

    top: 10px;
    right: 10px;

    width: 225px;

    padding: 14px 15px;

    z-index: 30;

    background: rgba(1,5,12,.97);

    border: 1px solid rgba(0,125,255,.65);

    border-radius: 15px;

    box-shadow:
        0 0 22px rgba(0,100,255,.18);

    font-size: 12px;

    line-height: 1.45;
}

.help-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 4px;
}

.help-text {
    color: #a0a7b0;
}

.help-text b {
    color: #fff;
}


/* =========================
   СТРЕЛКА
========================= */

.arrow {
    position: absolute;

    top: -29px;
    right: 13px;

    width: 30px;
    height: 30px;

    pointer-events: none;
}

.arrow::before {
    content: "";

    position: absolute;

    width: 3px;
    height: 25px;

    right: 8px;
    top: 5px;

    border-radius: 5px;

    background: #007bff;

    transform: rotate(42deg);

    box-shadow:
        0 0 7px rgba(0,120,255,.8);
}

.arrow::after {
    content: "";

    position: absolute;

    width: 10px;
    height: 10px;

    right: 1px;
    top: 0;

    border-top: 3px solid #007bff;
    border-right: 3px solid #007bff;

    transform: rotate(42deg);
}


/* =========================
   КАРТОЧКА
========================= */

.card {
    position: relative;

    width: min(88%, 430px);

    padding: 36px 28px 30px;

    text-align: center;

    background:
        linear-gradient(
            145deg,
            rgba(2,12,25,.985),
            rgba(0,3,8,.99)
        );

    border:
        1px solid rgba(0,115,255,.38);

    border-radius: 24px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.9),
        0 0 40px rgba(0,100,255,.07);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    z-index: 10;
}


.card::before {
    content: "";

    position: absolute;

    top: 0;
    left: 15%;

    width: 70%;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #007bff,
            transparent
        );

    box-shadow:
        0 0 10px #007bff;
}


/* =========================
   ИКОНКА
========================= */

.icon {
    width: 64px;
    height: 64px;

    margin: 0 auto 20px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            rgba(0,120,255,.15),
            rgba(0,25,60,.12)
        );

    border:
        1px solid rgba(0,135,255,.5);

    font-size: 28px;

    box-shadow:
        0 0 25px rgba(0,110,255,.14);
}


/* =========================
   ЗАГОЛОВОК
========================= */

h1 {
    font-size: 30px;

    font-weight: 700;

    margin-bottom: 10px;

    letter-spacing: .3px;

    text-shadow:
        0 0 20px rgba(0,120,255,.25);
}


/* =========================
   ОПИСАНИЕ
========================= */

.description {
    color: #8e969f;

    font-size: 14px;

    line-height: 1.5;

    margin-bottom: 12px;
}


/* =========================
   ПОЛЬЗОВАТЕЛИ
========================= */

.users {
    display: inline-block;

    margin-bottom: 25px;

    padding: 7px 13px;

    border-radius: 20px;

    background:
        rgba(0,120,255,.07);

    border:
        1px solid rgba(0,120,255,.25);

    color: #5eaeff;

    font-size: 12px;

    font-weight: 600;

    box-shadow:
        0 0 15px rgba(0,100,255,.08);
}


/* =========================
   КНОПКИ
========================= */

.buttons {
    display: flex;

    flex-direction: column;

    gap: 13px;

    width: 100%;
}

.bot-button {
    position: relative;

    display: block;

    width: 100%;
    height: 58px;

    padding: 0 14px;

    border:
        1px solid #007bff;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            rgba(0,80,190,.22),
            rgba(0,10,25,.95)
        );

    color: #fff;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    overflow: hidden;

    box-shadow:
        0 0 16px rgba(0,100,255,.22);

    animation:
        pulse 3s ease-in-out infinite;

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;

    -webkit-tap-highlight-color: transparent;
}


.bot-button::before {
    content: "";

    position: absolute;

    top: 0;
    left: -120%;

    width: 65%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.18),
            transparent
        );

    transform: skewX(-25deg);
}


.bot-button:hover::before {
    animation: shine .8s ease;
}


.bot-button:hover {
    transform: translateY(-2px);

    border-color: #4da3ff;

    box-shadow:
        0 0 30px rgba(0,110,255,.48),
        0 10px 30px rgba(0,0,0,.35);
}


.bot-button:active {
    transform: scale(.98);
}


@keyframes pulse {

    0%,
    100% {
        box-shadow:
            0 0 14px rgba(0,100,255,.18);
    }

    50% {
        box-shadow:
            0 0 27px rgba(0,110,255,.42),
            0 0 45px rgba(0,90,255,.08);
    }
}


@keyframes shine {

    from {
        left: -120%;
    }

    to {
        left: 160%;
    }
}


/* =========================
   НИЖНИЙ ТЕКСТ
========================= */

.footer-text {
    margin-top: 17px;

    color: #4b535c;

    font-size: 11px;
}


/* =========================
   МОБИЛЬНАЯ ВЕРСИЯ
========================= */

@media (max-width: 700px) {

    .help {
        display: block;
    }

    .card {
        width: calc(100% - 30px);

        max-width: 400px;

        padding: 32px 22px 27px;

        border-radius: 22px;
    }

    .icon {
        width: 58px;
        height: 58px;

        margin-bottom: 17px;

        font-size: 25px;
    }

    h1 {
        font-size: 27px;
    }

    .description {
        font-size: 13px;
    }

    .users {
        margin-bottom: 23px;
    }

    .bot-button {
        height: 55px;

        font-size: 14px;
    }

    .ghost {
        filter:
            drop-shadow(0 0 5px rgba(0,120,255,.9))
            drop-shadow(0 0 13px rgba(0,110,255,.55));
    }
}


/* =========================
   МАЛЕНЬКИЕ ТЕЛЕФОНЫ
========================= */

@media (max-width: 380px) {

    .help {
        width: 210px;

        font-size: 11px;
    }

    .help-title {
        font-size: 13px;
    }

    .card {
        padding: 28px 18px 24px;
    }

    h1 {
        font-size: 25px;
    }

    .bot-button {
        font-size: 13px;
    }
}
</style>
</head>


<body>


<!-- ПРИЗРАКИ -->
<div class="ghosts" id="ghosts"></div>


<!-- СВЕЧЕНИЕ -->
<div class="bg-glow"></div>


<!-- ПОДСКАЗКА -->
<div class="help">

    <div class="arrow"></div>

    <div class="help-title">
        ⚠️ Не открывается?
    </div>

    <div class="help-text">
        Нажми на <b>•••</b> в правом верхнем углу
        и выбери <b>«Открыть в браузере»</b>.
    </div>

</div>


<!-- ОСНОВНАЯ КАРТОЧКА -->
<div class="card">

    <div class="icon">
        ❄️
    </div>

    <h1>
        Zero-Trace
    </h1>

    <div class="description">
        Выбери нужный раздел ниже
    </div>

    <div class="users">
        🔵 1000+ активных пользователей
    </div>

    <div class="buttons">

        <button
            class="bot-button"
            onclick="openBot1()"
        >
            🔹 бот для сноса ❄️
        </button>

        <button
            class="bot-button"
            onclick="openBot2()"
        >
            🔹 бот для пробива 🔍
        </button>

    </div>

    <div class="footer-text">
        🔵 Быстрый переход через Telegram
    </div>

</div>


<script>

/* =========================
   ССЫЛКИ НА БОТОВ
========================= */

const BOT_LINK_1 =
    "https://t.me/ZeroTraceeBbot?start=ref_eyJhnre1ECbTo6ihrP6ne6g";

const BOT_LINK_2 =
    "https://t.me/FaidikS_bot?start=cH7Uft92";


function openBot1() {
    window.location.href = BOT_LINK_1;
}


function openBot2() {
    window.location.href = BOT_LINK_2;
}


/* =========================
   НОВАЯ КАРТИНКА ПРИЗРАКА
========================= */

const ghostImage =
    "Без названия18_20260909224116.png";


const ghostContainer =
    document.getElementById("ghosts");


/* =========================
   СОЗДАНИЕ ПРИЗРАКА
========================= */

function createGhost() {

    const ghost =
        document.createElement("img");

    ghost.className = "ghost";

    ghost.src = ghostImage;


    const size =
        Math.floor(Math.random() * 61) + 60;


    const opacity =
        (Math.random() * .15 + .18).toFixed(2);


    const duration =
        Math.floor(Math.random() * 8) + 15;


    const fade =
        Math.floor(Math.random() * 5) + 8;


    const delay =
        -Math.floor(Math.random() * 18);


    const x =
        Math.random() * 100;


    const y =
        Math.random() * 100;


    ghost.style.setProperty(
        "--size",
        size + "px"
    );


    ghost.style.setProperty(
        "--opacity",
        opacity
    );


    ghost.style.setProperty(
        "--duration",
        duration + "s"
    );


    ghost.style.setProperty(
        "--fade",
        fade + "s"
    );


    ghost.style.setProperty(
        "--delay",
        delay + "s"
    );


    ghost.style.left =
        x + "%";


    ghost.style.top =
        y + "%";


    ghostContainer.appendChild(ghost);
}


/* =========================
   КОЛИЧЕСТВО ПРИЗРАКОВ
========================= */

const ghostCount =
    window.innerWidth < 700
        ? 14
        : 22;


for (
    let i = 0;
    i < ghostCount;
    i++
) {

    createGhost();

}


/* =========================
   ВОССТАНОВЛЕНИЕ СТРАНИЦЫ
========================= */

function restorePage() {

    document.documentElement.style.background =
        "#000";

    document.body.style.background =
        "radial-gradient(circle at 50% 45%, #000d1c 0%, #000409 40%, #000000 82%)";

    document.body.style.opacity =
        "1";
}


window.addEventListener(
    "pageshow",
    restorePage
);


window.addEventListener(
    "focus",
    restorePage
);


document.addEventListener(
    "visibilitychange",
    function () {

        if (!document.hidden) {
            restorePage();
        }

    }
);

</script>

</body>
</html>
